<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anointed has moved</title>
<meta http-equiv="refresh" content="3;url=https://jdc001.github.io/Anointed/">
<link rel="canonical" href="https://jdc001.github.io/Anointed/">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  html,body{margin:0;height:100%;background:#1a120b;color:#f3e8cc;font-family:Georgia,'Times New Roman',serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box;gap:14px}
  img{width:120px;height:120px;border-radius:26px;box-shadow:0 6px 24px #000a}
  h1{font-size:30px;margin:6px 0 0;color:#f1d58c;letter-spacing:.04em}
  p{font-size:17px;line-height:1.5;max-width:30em;margin:0}
  a.go{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:10px;background:#e2b33c;color:#2a1d12;text-decoration:none;font-weight:700}
  small{opacity:.75;font-size:14px}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>Anointed has moved</h1>
  <p>The game now lives at <b>jdc001.github.io/Anointed</b>. Your campaigns, trophies and settings come with you.</p>
  <a class="go" id="go" href="https://jdc001.github.io/Anointed/">Go to Anointed</a>
  <small>On an iPhone or iPad, add the new page to your Home Screen from Safari, and remove this old icon.</small>
</main>
<script>
// retire this site's offline copy, then go to the new address (keeping ?map= and the like)
(async () => {
  const to = 'https://jdc001.github.io/Anointed/' + location.search + location.hash;
  document.getElementById('go').href = to;
  try {
    if ('serviceWorker' in navigator) for (const r of await navigator.serviceWorker.getRegistrations()) if (r.scope.includes('/crown-of-the-franks/')) await r.unregister();
    if (window.caches) for (const k of await caches.keys()) if (k.startsWith('cotf-')) await caches.delete(k);
  } catch (e) { }
  setTimeout(() => location.replace(to), 1200);
})();
</script>
</body>
</html>
