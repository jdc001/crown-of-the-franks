<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Crown of the Franks">
<meta name="theme-color" content="#1a120b">
<meta name="description" content="Crown of the Franks: 987. A turn-based strategy game of the broken empire of Charlemagne.">
<title>Crown of the Franks: 987</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;900&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header id="hdr"></header>
  <div id="main">
    <div id="mapwrap">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"></svg>
      <div id="tip" class="tip hidden"></div>
      <div id="mapctl">
        <button class="ctl" onclick="zoomBtn(0.75)" aria-label="Zoom in"><svg class="ic"><use href="#i-plus"/></svg></button>
        <button class="ctl" onclick="zoomBtn(1.33)" aria-label="Zoom out"><svg class="ic"><use href="#i-minus"/></svg></button>
        <button class="ctl" onclick="homeView(true)" aria-label="My lands"><svg class="ic"><use href="#i-home"/></svg></button>
      </div>
      <div id="legend" class="hidden"></div>
    </div>
    <aside id="panel">
      <div id="grip"><span></span></div>
      <div id="pbody"></div>
    </aside>
  </div>
  <nav id="dock"></nav>
</div>
<div id="turnov" class="hidden"></div>
<div id="modal" class="modal hidden"><div class="card" id="mcard"></div></div>
<div id="drawer" class="hidden"></div>
<div id="title"></div>
<div id="toast"></div>
<div id="hintbox" class="hidden"></div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/core.js"></script>
<script src="js/battle.js"></script>
<script src="js/ai.js"></script>
<script src="js/powers.js"></script>
<script src="js/audio.js"></script>
<script src="js/view.js"></script>
<script src="js/map.js"></script>
<script src="js/panels.js"></script>
<script src="js/dialogs.js"></script>
<script src="js/saves.js"></script>
<script src="js/replay.js"></script>
<script src="js/tutor.js"></script>
<script src="js/minigames.js"></script>
<script src="js/dealings.js"></script>
<script src="js/diplomacy.js"></script>
<script src="js/stats.js"></script>
<script src="js/heraldry.js"></script>
<script src="js/ending.js"></script>
<script src="js/battleview.js"></script>
<script src="js/catapult.js"></script>
<script src="js/difficulty.js"></script>
<script src="js/app.js"></script>
</body>
</html>
